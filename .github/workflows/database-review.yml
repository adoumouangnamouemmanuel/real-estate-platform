name: Database architecture review
on:
  pull_request:
    branches: [dba]
  push:
    branches: [review/lumavok-database-architecture]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - working-directory: database/full-database-design
        run: npm ci && npm test
